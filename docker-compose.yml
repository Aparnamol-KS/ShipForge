services:
  postgres:
    image: postgres:16
    container_name: shipforge-postgres
    environment:
      POSTGRES_USER: shipforge
      POSTGRES_PASSWORD: shipforge_password
      POSTGRES_DB: shipforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: shipforge-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: