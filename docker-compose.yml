services:
  postgres:
    image: postgres:16
    container_name: shipforge-postgres
    environment:
      POSTGRES_USER: shipforge
      POSTGRES_PASSWORD: shipforge_password
      POSTGRES_DB: shipforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: shipforge-redis
    ports:
      - "6379:6379"

  worker:
    build:
      context: ./backend
    container_name: shipforge-worker
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg2://shipforge:shipforge_password@postgres:5432/shipforge
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - build_workspaces:/build_workspaces
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  build_workspaces: